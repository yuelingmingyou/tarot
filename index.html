<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>塔罗密卷 · Tarot Arcana</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:hsl(248,88%,4%);
  --violet:hsl(238,100%,67%);
  --violet-soft:hsl(238,90%,78%);
  --gold:hsl(46,92%,57%);
  --cream:hsl(48,33%,94%);
}
*{box-sizing:border-box;border-color:hsl(244,35%,22%)}
html{background:var(--ink)}
body{
  margin:0;min-height:100vh;color:var(--cream);
  background:
    radial-gradient(1200px 800px at 85% -10%, hsla(238,46%,27%,.5), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, hsla(238,46%,27%,.35), transparent 55%),
    var(--ink);
  font-family:"Noto Serif SC","Songti SC","PingFang SC","Microsoft YaHei",serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--cream)}
.font-display{font-family:"Cinzel","Noto Serif SC","Songti SC",serif}
.font-body{font-family:"Cormorant Garamond","Noto Serif SC","Songti SC",serif}
.mono-label{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.34em;text-transform:uppercase}
.text-gold{color:var(--gold)}
.text-violet{color:var(--violet-soft)}

/* ── 星空 ── */
#starfield{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#starfield span{position:absolute;border-radius:50%;animation:twinkle var(--d) ease-in-out var(--dl) infinite}
@keyframes twinkle{0%,100%{opacity:var(--omin);transform:scale(1)}50%{opacity:var(--omax);transform:scale(1.25)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.breathe{animation:breathe 4.5s ease-in-out infinite}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.enter{animation:enter .5s cubic-bezier(.22,1,.36,1) both}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}

/* ── 顶部 ── */
header{
  position:sticky;top:0;z-index:30;border-bottom:1px solid hsla(238,100%,67%,.15);
  background:hsla(248,88%,4%,.75);backdrop-filter:blur(14px);
}
.header-inner{max-width:1600px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-name{font-family:"Cinzel","Noto Serif SC",serif;font-size:18px;letter-spacing:.35em}
.brand-sub{font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.34em;color:hsla(238,90%,78%,.6);text-transform:uppercase}
.header-actions{display:flex;align-items:center;gap:12px}

/* ── 按钮 ── */
.pill-btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:999px;
  border:1px solid hsla(238,100%,67%,.35);background:hsla(248,70%,6%,.7);
  padding:8px 16px;font-size:12px;letter-spacing:.2em;color:var(--violet-soft);
  transition:all .25s;
}
.pill-btn:hover{border-color:hsla(238,100%,67%,.6);box-shadow:0 0 24px hsla(238,100%,67%,.35)}
.pill-btn.solid{background:hsla(238,100%,67%,.25);color:var(--cream)}
.pill-btn.gold{border-color:hsla(46,92%,57%,.45);color:var(--gold)}
.pill-btn.gold:hover{background:hsla(46,92%,57%,.1)}
.pill-btn.ghost{border-color:hsl(244,35%,35%);color:hsla(48,33%,94%,.6);background:transparent}
.pill-btn.danger{border-color:hsla(0,62%,45%,.5);color:hsl(0,70%,70%)}
.pill-btn:disabled{opacity:.5;pointer-events:none}
.pill-btn svg{width:14px;height:14px}

/* ── 布局 ── */
.layout{max-width:1600px;margin:0 auto;display:flex;position:relative;z-index:1}
aside{
  width:288px;flex-shrink:0;border-right:1px solid hsla(238,100%,67%,.15);
  background:hsla(248,88%,4%,.85);backdrop-filter:blur(14px);
  position:sticky;top:64px;height:calc(100vh - 64px);display:flex;flex-direction:column;
}
main{flex:1;min-width:0;padding:40px 48px 80px}
@media(max-width:1023px){
  aside{position:fixed;inset:0 auto 0 0;z-index:20;padding-top:64px;transform:translateX(-100%);transition:transform .3s}
  aside.open{transform:none}
  main{padding:32px 16px 64px}
  #menu-btn{display:inline-flex!important}
  #backdrop.show{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6)}
}
#menu-btn{display:none}
#backdrop{display:none}
#backdrop.show{display:block}

/* ── 牌谱侧栏 ── */
.search-wrap{position:relative;padding:16px 16px 0}
.search-wrap svg{position:absolute;left:28px;top:50%;margin-top:8px;transform:translateY(-50%);width:14px;height:14px;color:hsla(238,90%,78%,.5)}
.search-wrap input{
  width:100%;border-radius:999px;border:1px solid hsla(238,100%,67%,.2);
  background:hsla(248,70%,6%,.7);padding:8px 16px 8px 36px;font-size:14px;outline:none;
}
.search-wrap input::placeholder{color:hsla(238,90%,78%,.35)}
.search-wrap input:focus{border-color:hsla(238,100%,67%,.55);box-shadow:0 0 0 1px hsla(238,100%,67%,.3)}
.card-list{flex:1;overflow-y:auto;padding:12px 12px 24px;margin-top:4px}
.card-list::-webkit-scrollbar,textarea::-webkit-scrollbar{width:6px}
.card-list::-webkit-scrollbar-thumb,textarea::-webkit-scrollbar-thumb{background:hsla(238,100%,67%,.25);border-radius:3px}
.group-title{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:10px 8px;text-align:left;
}
.group-title .mono-label{font-size:10px;color:hsla(46,92%,57%,.8)}
.group-title svg{width:14px;height:14px;color:hsla(238,90%,78%,.5);transition:transform .3s}
.group-title.closed svg{transform:rotate(-90deg)}
.card-item{
  width:100%;display:flex;align-items:baseline;gap:12px;border-radius:8px;
  padding:8px 12px;text-align:left;transition:all .2s;
}
.card-item:hover{background:hsla(238,100%,67%,.06)}
.card-item.active{background:hsla(238,100%,67%,.14);box-shadow:0 0 24px hsla(238,100%,67%,.2)}
.card-numeral{font-family:"Cinzel",serif;width:36px;flex-shrink:0;font-size:11px;letter-spacing:.1em;color:hsla(238,90%,78%,.45)}
.card-item.active .card-numeral{color:var(--gold)}
.card-name{flex:1;font-size:14px;letter-spacing:.15em;color:hsla(48,33%,94%,.65)}
.card-item:hover .card-name,.card-item.active .card-name{color:var(--cream)}
.note-dot{width:6px;height:6px;border-radius:50%;background:hsla(46,92%,57%,.8);align-self:center;flex-shrink:0}
.active-star{font-size:10px;color:var(--gold)}

/* ── 牌组下拉 ── */
.deck-menu{
  position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:288px;border-radius:12px;padding:8px;
  background:linear-gradient(158deg,hsla(247,60%,12%,.95),hsla(248,80%,5%,.97));
  border:1px solid hsla(238,100%,67%,.18);backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.55);
}
.deck-item{
  display:flex;align-items:center;justify-content:space-between;border-radius:8px;
  padding:8px 12px;cursor:pointer;transition:background .2s;font-size:14px;letter-spacing:.1em;
  color:hsla(48,33%,94%,.65);
}
.deck-item:hover{background:hsla(238,100%,67%,.07)}
.deck-item.current{background:hsla(238,100%,67%,.15);color:var(--cream)}
.deck-item .ops{display:flex;gap:4px;opacity:0;transition:opacity .2s}
.deck-item:hover .ops{opacity:1}
.deck-item .ops button{padding:4px;border-radius:4px;color:hsla(238,90%,78%,.6)}
.deck-item .ops button:hover{color:var(--violet-soft)}
.deck-item .ops button.del:hover{color:hsl(0,70%,70%)}
.deck-item .ops svg{width:12px;height:12px}
.deck-new{display:flex;width:100%;align-items:center;gap:8px;border-radius:8px;padding:8px 12px;font-size:14px;color:hsla(46,92%,57%,.8)}
.deck-new:hover{background:hsla(46,92%,57%,.08);color:var(--gold)}
.deck-input-row{display:flex;align-items:center;gap:8px;padding:6px 8px}
.deck-input-row input{flex:1;min-width:0;border-radius:6px;border:1px solid hsla(238,100%,67%,.4);background:transparent;padding:6px 8px;font-size:14px;outline:none}
.deck-input-row button{color:var(--gold)}

/* ── 主区 ── */
.detail-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:64px}
@media(max-width:1279px){.detail-grid{gap:40px}}
@media(max-width:1023px){.detail-grid{grid-template-columns:1fr}}
.face-col{position:sticky;top:96px;align-self:start}
@media(max-width:1023px){.face-col{position:static}}

/* ── 卡面 ── */
.card-face{position:relative;margin:0 auto;width:100%;max-width:320px}
.face-glow{position:absolute;inset:-12px;border-radius:26px;background:hsla(238,100%,67%,.12);filter:blur(24px);opacity:.6;transition:opacity .7s}
.card-face:hover .face-glow{opacity:1}
.face-frame{
  position:relative;aspect-ratio:2/3.4;overflow:hidden;border-radius:16px;
  border:1px solid hsla(238,100%,67%,.3);box-shadow:0 18px 50px rgba(0,0,0,.6);
  transition:transform .5s;
}
.card-face:hover .face-frame{transform:translateY(-6px)}
.face-frame img{width:100%;height:100%;object-fit:cover;display:block}
.face-placeholder{
  position:relative;width:100%;height:100%;
  background:linear-gradient(165deg,#1c1650 0%,#0c0830 45%,#04021a 100%);
}
.fp-border1{position:absolute;inset:7%;border-radius:12px;border:1px solid hsla(46,92%,57%,.4)}
.fp-border2{position:absolute;inset:10.5%;border-radius:8px;border:1px solid hsla(46,92%,57%,.18)}
.fp-dot{position:absolute;width:6px;height:6px;transform:rotate(45deg);background:hsla(46,92%,57%,.7)}
.fp-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 24px;text-align:center}
.fp-content svg{width:80px;height:80px}
.fp-numeral{font-family:"Cinzel",serif;font-size:30px;letter-spacing:.2em;color:var(--gold)}
.fp-name{font-family:"Cinzel","Noto Serif SC",serif;font-size:20px;letter-spacing:.35em}
.fp-en{font-size:14px;letter-spacing:.18em;color:hsla(238,90%,78%,.7);margin-top:8px}
.fp-deck{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:hsla(238,90%,78%,.45)}
.face-vignette{position:absolute;top:0;left:0;right:0;height:64px;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent);pointer-events:none}
.face-actions{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:12px}
.face-hint{margin-top:20px;text-align:center;font-size:12px;line-height:1.8;color:hsla(238,90%,78%,.4)}

/* ── 详情 ── */
.detail-head{text-align:center}
@media(min-width:1024px){.detail-head{text-align:left}}
.detail-numeral{font-family:"Cinzel",serif;font-size:14px;letter-spacing:.5em;color:hsla(46,92%,57%,.7)}
.detail-title{font-family:"Cinzel","Noto Serif SC",serif;font-size:44px;letter-spacing:.25em;margin:4px 0 0}
@media(min-width:1024px){.detail-title{font-size:52px}}
.detail-en{font-size:18px;letter-spacing:.2em;color:hsla(238,90%,78%,.7);margin-top:8px}
.chips{margin-top:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
@media(min-width:1024px){.chips{justify-content:flex-start}}
.chip{border-radius:999px;padding:6px 16px;font-size:12px;letter-spacing:.25em}
.chip.gold{border:1px solid hsla(46,92%,57%,.35);color:var(--gold);position:relative;overflow:hidden}
.chip.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,hsla(238,90%,78%,.18) 50%,transparent 70%);animation:sweep 3.2s linear infinite}
.chip.violet{border:1px solid hsla(238,100%,67%,.35);color:var(--violet-soft)}
.chip.kw{background:hsla(244,40%,18%,.6);color:hsla(48,33%,94%,.75);letter-spacing:.15em;padding:6px 12px}
.chip-input{border-radius:999px;background:transparent;text-align:center;font-size:12px;outline:none;padding:6px 12px}
.chip-input.el{width:112px;border:1px solid hsla(46,92%,57%,.4);color:var(--gold)}
.chip-input.astro{width:150px;border:1px solid hsla(238,100%,67%,.4);color:var(--violet-soft)}
.chip-input.kw{width:260px;border:1px solid hsl(244,35%,35%);color:hsla(48,33%,94%,.8)}

.panel{
  margin-top:32px;border-radius:16px;padding:24px;
  background:linear-gradient(158deg,hsla(247,60%,12%,.72),hsla(248,80%,5%,.8));
  border:1px solid hsla(238,100%,67%,.18);backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 hsla(238,90%,78%,.08);
}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.panel-title{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:hsla(46,92%,57%,.8);display:flex;align-items:center;gap:8px}
.panel-title svg{width:14px;height:14px}
.orient-toggle{display:flex;border-radius:999px;border:1px solid hsla(238,100%,67%,.25);padding:2px}
.orient-toggle button{border-radius:999px;padding:4px 16px;font-size:12px;letter-spacing:.3em;color:hsla(238,90%,78%,.5);transition:all .3s}
.orient-toggle button.on{background:hsla(238,100%,67%,.25);color:var(--cream);box-shadow:0 0 24px hsla(238,100%,67%,.35)}
.meaning{padding:16px 0;border-bottom:1px solid hsla(238,100%,67%,.1)}
.meaning:last-child{border-bottom:none}
.meaning-label{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.meaning-label .ic{width:20px;text-align:center;font-size:14px;color:hsla(46,92%,57%,.8)}
.meaning-label .mono-label{font-size:10px;color:hsla(238,90%,78%,.8)}
.meaning p{margin:0;padding-left:28px;font-size:14px;line-height:1.9;color:hsla(48,33%,94%,.85)}
.meaning textarea,.myth-textarea,.note-textarea{
  width:100%;resize:vertical;border-radius:8px;border:1px solid hsla(238,100%,67%,.3);
  background:hsla(248,70%,5%,.8);padding:12px;font-size:14px;line-height:1.8;outline:none;
}
.meaning textarea:focus,.myth-textarea:focus,.note-textarea:focus{border-color:hsla(238,100%,67%,.6)}
.myth-text{font-size:15px;line-height:2;color:hsla(48,33%,94%,.8);margin:0}
.myth-text::first-letter{font-size:24px;color:var(--gold)}
.note-textarea::placeholder{color:hsla(238,90%,78%,.3)}
.note-save{margin-top:12px;display:flex;justify-content:flex-end}

/* ── 翻牌轮播 ── */
.nav-arrow{
  position:fixed;top:50%;transform:translateY(-50%);z-index:25;
  width:48px;height:48px;border-radius:50%;
  border:1px solid hsla(238,100%,67%,.3);background:hsla(248,70%,6%,.6);backdrop-filter:blur(8px);
  color:var(--violet-soft);display:flex;align-items:center;justify-content:center;
  transition:all .25s;opacity:.55;
}
.nav-arrow:hover{opacity:1;border-color:hsla(238,100%,67%,.6);box-shadow:0 0 24px hsla(238,100%,67%,.35);color:var(--cream)}
.nav-arrow:active{transform:translateY(-50%) scale(.92)}
.nav-arrow svg{width:20px;height:20px}
.nav-arrow.prev{left:calc(288px + 18px)}
.nav-arrow.next{right:18px}
@media(max-width:1023px){
  .nav-arrow{width:40px;height:40px;opacity:.8}
  .nav-arrow.prev{left:10px}
  .nav-arrow.next{right:10px}
}
@keyframes slide-from-right{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes slide-from-left{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
.slide-next{animation:slide-from-right .45s cubic-bezier(.22,1,.36,1) both}
.slide-prev{animation:slide-from-left .45s cubic-bezier(.22,1,.36,1) both}

/* ── 卡面牌组标注 ── */
.face-deck-badge{
  margin:14px auto 0;width:fit-content;max-width:100%;
  display:flex;align-items:center;gap:8px;border-radius:999px;
  border:1px solid hsla(46,92%,57%,.35);background:hsla(46,92%,57%,.06);
  padding:5px 16px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.25em;
  color:hsla(46,92%,57%,.9);text-transform:uppercase;
}
.face-deck-badge .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px hsla(46,92%,57%,.8)}
.face-counter{
  margin-top:10px;text-align:center;font-family:"JetBrains Mono",monospace;
  font-size:10px;letter-spacing:.34em;color:hsla(238,90%,78%,.45);
}

/* ── Toast ── */
#toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:50;
  border-radius:999px;padding:10px 24px;font-size:13px;letter-spacing:.15em;
  background:hsla(247,60%,12%,.95);border:1px solid hsla(238,100%,67%,.35);color:var(--cream);
  box-shadow:0 0 32px hsla(238,100%,67%,.3);opacity:0;pointer-events:none;transition:all .3s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="starfield"></div>

<header>
  <div class="header-inner">
    <div class="brand">
      <button id="menu-btn" class="pill-btn ghost" style="padding:8px" aria-label="牌谱">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <svg class="breathe" width="20" height="20" viewBox="0 0 24 24" fill="hsl(46,92%,57%)"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <div>
        <div class="brand-name">塔罗密卷</div>
        <div class="brand-sub">Tarot Arcana Codex</div>
      </div>
    </div>
    <div class="header-actions">
      <div style="position:relative">
        <button id="deck-btn" class="pill-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="hsl(46,92%,57%)" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          <span id="deck-btn-name" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">牌组</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transition:transform .3s" id="deck-chevron"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="deck-menu" class="deck-menu enter" style="display:none">
          <div class="mono-label" style="padding:8px 12px;font-size:9px;color:hsla(46,92%,57%,.7)">牌组 · Decks</div>
          <div id="deck-list" style="max-height:256px;overflow-y:auto"></div>
          <div style="border-top:1px solid hsla(238,100%,67%,.12);margin-top:4px;padding-top:8px" id="deck-new-wrap"></div>
        </div>
      </div>
      <div id="edit-actions"></div>
    </div>
  </div>
</header>

<div class="layout">
  <div id="backdrop"></div>
  <aside id="sidebar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" placeholder="以名寻牌…" />
    </div>
    <div class="card-list" id="card-list"></div>
  </aside>

  <main>
    <div class="detail-grid enter" id="main-grid">
      <div class="face-col">
        <div class="card-face">
          <div class="face-glow"></div>
          <div class="face-frame" id="face-frame"></div>
        </div>
        <div class="face-deck-badge" id="face-badge"></div>
        <div class="face-actions" id="face-actions"></div>
        <div class="face-counter" id="face-counter"></div>
        <p class="face-hint" id="face-hint"></p>
      </div>
      <div id="detail-col"></div>
    </div>
  </main>

          const noted = !!notes[c.key];
          html += `<button class="card-item ${active ? "active" : ""}" data-key="${c.key}">
            <span class="card-numeral">${esc(c.numeral)}</span>
            <span class="card-name">${esc(c.nameCn)}</span>
            ${noted ? '<span class="note-dot" title="已有编纂"></span>' : ""}
            ${active ? '<span class="active-star breathe">✦</span>' : ""}
          </button>`;
        }
      }
      html += "</div>";
    }
    if (!html) html = '<p style="padding:32px 16px;text-align:center;font-size:14px;color:hsla(238,90%,78%,.4)">星空中没有这个名字</p>';
    list.innerHTML = html;

    list.querySelectorAll(".group-title").forEach((b) =>
      b.addEventListener("click", () => {
        const g = b.dataset.group;
        state.collapsed[g] = !state.collapsed[g];
        renderSidebar();
      })
    );
    list.querySelectorAll(".card-item").forEach((b) =>
      b.addEventListener("click", () => selectCard(b.dataset.key))
    );
  }

  function selectCard(key, dir) {
    state.cardKey = key;
    state.orientation = "upright";
    state.editing = false;
    state.draft = null;
    state.sidebarOpen = false;
    state.slideDir = dir || 0;
    renderAll();
    state.slideDir = 0;
    if (window.innerWidth < 1024) window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* 轮播：上一张 / 下一张（循环） */
  function goCard(dir) {
    if (state.editing && !confirm("正在编纂中，切换牌面将放弃未保存的修改。继续？")) return;
    const idx = ALL_CARDS.findIndex((c) => c.key === state.cardKey);
    const next = (idx + dir + ALL_CARDS.length) % ALL_CARDS.length;
    selectCard(ALL_CARDS[next].key, dir);
  }

  /* ── 牌组菜单 ── */
  function renderDeckMenu() {
    $("deck-btn-name").textContent = currentDeck()?.name ?? "选择牌组";
    $("deck-chevron").style.transform = state.deckMenuOpen ? "rotate(180deg)" : "";
    const menu = $("deck-menu");
    menu.style.display = state.deckMenuOpen ? "block" : "none";
    if (!state.deckMenuOpen) return;

    const list = $("deck-list");
    list.innerHTML = "";
    for (const d of decks) {
      if (state.renamingId === d.id) {
        const row = document.createElement("div");
        row.className = "deck-input-row";
        row.innerHTML = `<input value="${esc(d.name)}" /><button title="确认"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></button>`;
        const input = row.querySelector("input");
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") commitRename(d.id, input.value);
          if (e.key === "Escape") { state.renamingId = null; renderDeckMenu(); }
        });
        row.querySelector("button").addEventListener("click", () => commitRename(d.id, input.value));
        list.appendChild(row);
        input.focus();
        continue;
      }
      const row = document.createElement("div");
      row.className = "deck-item" + (d.id === state.deckId ? " current" : "");
      row.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.name)}</span>
        <span class="ops">
          <button title="重命名"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
          ${decks.length > 1 ? '<button class="del" title="删除牌组"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' : ""}
        </span>`;
      row.addEventListener("click", () => {
        state.deckId = d.id;
        state.deckMenuOpen = false;
        renderAll();
      });
      const [ren, del] = row.querySelectorAll(".ops button");
      ren.addEventListener("click", (e) => {
        e.stopPropagation();
        state.renamingId = d.id;
        renderDeckMenu();
      });
      if (del)
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!confirm(`确认删除牌组「${d.name}」？其中的卡面将一并移除。`)) return;
          localStorage.removeItem(kImages(d.id));
          decks = decks.filter((x) => x.id !== d.id);
          saveJSON(K_DECKS, decks);
          if (state.deckId === d.id) state.deckId = decks[0].id;
          renderAll();
          toast("牌组已消解");
        });
      list.appendChild(row);
    }

    const wrap = $("deck-new-wrap");
    if (state.deckCreating) {
      wrap.innerHTML = `<div class="deck-input-row"><input placeholder="新牌组之名…" /><button title="确认"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></button></div>`;
      const input = wrap.querySelector("input");
      const commit = () => {
        const name = input.value.trim();
        if (!name) return;
        const id = Math.max(...decks.map((d) => d.id)) + 1;
        decks.push({ id, name });
        saveJSON(K_DECKS, decks);
        state.deckId = id;
        state.deckCreating = false;
        state.deckMenuOpen = false;
        renderAll();
        toast("新牌组已缔结");
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") commit();
        if (e.key === "Escape") { state.deckCreating = false; renderDeckMenu(); }
      });
      wrap.querySelector("button").addEventListener("click", commit);
      input.focus();
    } else {
      wrap.innerHTML = `<button class="deck-new"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 缔结新牌组</button>`;
      wrap.querySelector("button").addEventListener("click", () => {
        state.deckCreating = true;
        renderDeckMenu();
      });
    }
  }

  function commitRename(id, val) {
    const name = val.trim();
    if (name) {
      decks.find((d) => d.id === id).name = name;
      saveJSON(K_DECKS, decks);
      toast("牌组已更名");
    }
    state.renamingId = null;
    renderDeckMenu();
  }

  /* ── 卡面 ── */
  function renderFace() {
    const card = getMerged(state.cardKey);
    const img = getImages()[state.cardKey];
    const frame = $("face-frame");
    if (img) {
      frame.innerHTML = `<img src="${img}" alt="${esc(card.nameCn)}" /><div class="face-vignette"></div>`;
    } else {
      frame.innerHTML = `<div class="face-placeholder">
        <div class="fp-border1"></div><div class="fp-border2"></div>
        <span class="fp-dot" style="top:4%;left:5%"></span><span class="fp-dot" style="top:4%;right:5%"></span>
        <span class="fp-dot" style="bottom:4%;left:5%"></span><span class="fp-dot" style="bottom:4%;right:5%"></span>
        <div class="fp-content">
          ${glyph(card.arcana)}
          <div class="fp-numeral">${esc(card.numeral)}</div>
          <div>
            <div class="fp-name">${esc(card.nameCn)}</div>
            <div class="fp-en font-body">${esc(card.nameEn)}</div>
          </div>
          <div class="fp-deck">${esc(currentDeck()?.name ?? "")}</div>
        </div>
        <div class="face-vignette"></div>
      </div>`;
    }

    const actions = $("face-actions");
    actions.innerHTML = "";
    const up = document.createElement("label");
    up.className = "pill-btn";
    up.style.cursor = "pointer";
    up.innerHTML = `${img ? "更换卡面" : "上传卡面"}<input type="file" accept="image/*" style="display:none" />`;
    up.querySelector("input").addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (f) uploadImage(f);
    });
    actions.appendChild(up);
    if (img && state.editing) {
      const del = document.createElement("button");
      del.className = "pill-btn danger";
      del.textContent = "移除卡面";
      del.addEventListener("click", () => {
        const imgs = getImages();
        delete imgs[state.cardKey];
        saveJSON(kImages(state.deckId), imgs);
        renderFace();
        toast("卡面已移除");
      });
      actions.appendChild(del);
    }

    /* 牌组标注 + 位置计数 */
    $("face-badge").innerHTML = `<span class="dot"></span>${esc(currentDeck()?.name ?? "…")}${img ? "" : " · 待上传"}`;
    const pos = ALL_CARDS.findIndex((c) => c.key === state.cardKey) + 1;
    $("face-counter").textContent = `${String(pos).padStart(2, "0")} / ${ALL_CARDS.length} · ◂ 滑动或点按两侧箭头翻牌 ▸`;

    $("face-hint").innerHTML = `卡面将保存在当前牌组「${esc(currentDeck()?.name ?? "…")}」之下，<br/>切换牌组即可为同一张牌挂上不同的卡面。<br/><span style="color:hsla(238,90%,78%,.3)">静态版数据保存在此浏览器中。</span>`;
  }

  function uploadImage(file) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const maxDim = 760;
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#0a0620";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
      const imgs = getImages();
      imgs[state.cardKey] = dataUrl;
      if (saveJSON(kImages(state.deckId), imgs)) {
        renderFace();
        toast("卡面已镌刻");
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      toast("图片读取失败");
    };
    img.src = url;
  }

  /* ── 详情 ── */
  function renderDetail() {
    const card = getMerged(state.cardKey);
    const editing = state.editing;
    const shown = editing && state.draft ? state.draft : card;
    const note = notes[state.cardKey]?.personalNote ?? "";
    const col = $("detail-col");

    const chipsHtml = editing
      ? `<input class="chip-input el" id="d-element" value="${esc(shown.element)}" placeholder="元素" />
         <input class="chip-input astro" id="d-astro" value="${esc(shown.astro)}" placeholder="行星 / 星座" />
         <input class="chip-input kw" id="d-keywords" value="${esc(shown.keywords.join("、"))}" placeholder="关键词，以顿号分隔" />`
      : `<span class="chip gold">${esc(shown.element.length <= 2 ? shown.element + "元素" : shown.element)}</span>
         <span class="chip violet">${esc(shown.astro)}</span>
         ${shown.keywords.map((k) => `<span class="chip kw">${esc(k)}</span>`).join("")}`;

    const meaningsHtml = CONTEXTS.map(([id, label, icon]) => {
      const v = shown[state.orientation][id];
      return `<div class="meaning">
        <div class="meaning-label">
          <span class="ic">${icon}</span>
          <span class="mono-label">${label}</span>
        </div>
        ${editing
          ? `<textarea rows="3" data-ctx="${id}">${esc(v)}</textarea>`
          : `<p>${esc(v)}</p>`}
      </div>`;
    }).join("");

    col.innerHTML = `
      <header class="detail-head">
        <div class="detail-numeral">${esc(card.numeral)}</div>
        <h1 class="detail-title">${esc(shown.nameCn)}</h1>
        <p class="detail-en font-body">${esc(shown.nameEn)}</p>
        <div class="chips">${chipsHtml}</div>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">牌义 · Arcana</h2>
          <div class="orient-toggle">
            <button data-orient="upright" class="${state.orientation === "upright" ? "on" : ""}">正位</button>
            <button data-orient="reversed" class="${state.orientation === "reversed" ? "on" : ""}">逆位</button>
          </div>
        </div>
        <div class="enter" key="${state.orientation}">${meaningsHtml}</div>
      </section>

      <section class="panel">
        <h2 class="panel-title" style="margin-bottom:16px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          神话渊源 · Mythos
        </h2>
        ${editing
          ? `<textarea class="myth-textarea" id="d-myth" rows="6">${esc(shown.myth)}</textarea>`
          : `<p class="myth-text font-body">${esc(shown.myth)}</p>`}
      </section>

      <section class="panel">
        <h2 class="panel-title" style="margin-bottom:16px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>
          我的笔记 · Marginalia
        </h2>
        <textarea class="note-textarea" id="d-note" rows="4" placeholder="在此记录你与这张牌的私人联结——抽牌记录、梦境、直觉……">${esc(note)}</textarea>
        <div class="note-save">
          <button class="pill-btn gold" id="note-save-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            封存笔记
          </button>
        </div>
      </section>`;

    /* 交互绑定 */
    col.querySelectorAll(".orient-toggle button").forEach((b) =>
      b.addEventListener("click", () => {
        if (state.editing) syncDraftFromDOM();
        state.orientation = b.dataset.orient;
        renderDetail();
      })
    );

    if (editing) {
      const syncSimple = () => {
        state.draft.element = $("d-element").value;
        state.draft.astro = $("d-astro").value;
        state.draft.keywords = $("d-keywords").value.split(/[,，、]/).map((s) => s.trim()).filter(Boolean);
      };
      ["d-element", "d-astro", "d-keywords"].forEach((id) => $(id).addEventListener("input", syncSimple));
      col.querySelectorAll("textarea[data-ctx]").forEach((ta) =>
        ta.addEventListener("input", () => {
          state.draft[state.orientation][ta.dataset.ctx] = ta.value;
        })
      );
      $("d-myth").addEventListener("input", (e) => (state.draft.myth = e.target.value));
    }

    $("note-save-btn").addEventListener("click", () => {
      const val = $("d-note").value;
      const existing = notes[state.cardKey] || {};
      notes[state.cardKey] = { ...existing, personalNote: val };
      if (saveJSON(K_NOTES, notes)) {
        toast("笔记已封存");
        renderSidebar();
      }
    });
  }

  function syncDraftFromDOM() {
    if (!state.editing || !state.draft) return;
    if ($("d-element")) {
      state.draft.element = $("d-element").value;
      state.draft.astro = $("d-astro").value;
      state.draft.keywords = $("d-keywords").value.split(/[,，、]/).map((s) => s.trim()).filter(Boolean);
      state.draft.myth = $("d-myth").value;
    }
    document.querySelectorAll("textarea[data-ctx]").forEach((ta) => {
      state.draft[state.orientation][ta.dataset.ctx] = ta.value;
    });
  }

  /* ── 编纂按钮区 ── */
  function renderEditActions() {
    const wrap = $("edit-actions");
    wrap.innerHTML = "";
    wrap.style.display = "flex";
    wrap.style.gap = "12px";
    if (!state.editing) {
      const b = document.createElement("button");
      b.className = "pill-btn";
      b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg> 编纂此牌`;
      b.addEventListener("click", () => {
        state.draft = JSON.parse(JSON.stringify(getMerged(state.cardKey)));
        state.editing = true;
        renderAll();
      });
      wrap.appendChild(b);
      return;
    }
    const save = document.createElement("button");
    save.className = "pill-btn solid";
    save.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> 保存`;
    save.addEventListener("click", () => {
      syncDraftFromDOM();
      const { element, astro, keywords, upright, reversed, myth } = state.draft;
      const existing = notes[state.cardKey] || {};
      notes[state.cardKey] = {
        ...existing,
        overrides: JSON.stringify({ element, astro, keywords, upright, reversed, myth }),
      };
      if (saveJSON(K_NOTES, notes)) {
        state.editing = false;
        state.draft = null;
        renderAll();
        toast("编纂已封存");
      }
    });
    const reset = document.createElement("button");
    reset.className = "pill-btn gold";
    reset.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg> 恢复初始`;
    reset.addEventListener("click", () => {
      if (!confirm("恢复为初始牌义？你的编纂将被清除（笔记保留）。")) return;
      const existing = notes[state.cardKey] || {};
      const next = { ...existing };
      delete next.overrides;
      if (next.personalNote) notes[state.cardKey] = next;
      else delete notes[state.cardKey];
      saveJSON(K_NOTES, notes);
      state.editing = false;
      state.draft = null;
      renderAll();
      toast("已恢复为初始牌义");
    });
    const cancel = document.createElement("button");
    cancel.className = "pill-btn ghost";
    cancel.textContent = "取消";
    cancel.addEventListener("click", () => {
      state.editing = false;
      state.draft = null;
      renderAll();
    });
    wrap.append(save, reset, cancel);
  }

  /* ── 总渲染 ── */
  function renderAll() {
    renderSidebar();
    renderDeckMenu();
    renderFace();
    renderDetail();
    renderEditActions();
    const grid = $("main-grid");
    grid.classList.remove("enter", "slide-next", "slide-prev");
    void grid.offsetWidth;
    grid.classList.add(state.slideDir === 1 ? "slide-next" : state.slideDir === -1 ? "slide-prev" : "enter");
  }

  /* ── 全局事件 ── */
  $("search").addEventListener("input", (e) => {
    state.query = e.target.value;
    renderSidebar();
  });
  $("deck-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    state.deckMenuOpen = !state.deckMenuOpen;
    renderDeckMenu();
  });
  document.addEventListener("mousedown", (e) => {
    if (state.deckMenuOpen && !$("deck-menu").contains(e.target) && !$("deck-btn").contains(e.target)) {
      state.deckMenuOpen = false;
      state.deckCreating = false;
      state.renamingId = null;
      renderDeckMenu();
    }
  });
  $("menu-btn").addEventListener("click", () => {
    state.sidebarOpen = !state.sidebarOpen;
    $("sidebar").classList.toggle("open", state.sidebarOpen);
    $("backdrop").classList.toggle("show", state.sidebarOpen);
  });
  $("backdrop").addEventListener("click", () => {
    state.sidebarOpen = false;
    $("sidebar").classList.remove("open");
    $("backdrop").classList.remove("show");
  });
  // 侧栏选中后在移动端收起
  $("card-list").addEventListener("click", (e) => {
    if (e.target.closest(".card-item") && window.innerWidth < 1024) {
      state.sidebarOpen = false;
      $("sidebar").classList.remove("open");
      $("backdrop").classList.remove("show");
    }
  });

  /* ── 轮播导航：箭头 / 触屏滑动 / 键盘 ── */
  $("nav-prev").addEventListener("click", () => goCard(-1));
  $("nav-next").addEventListener("click", () => goCard(1));

  let touchX = null, touchY = null;
  document.addEventListener("touchstart", (e) => {
    if (e.target.closest("input, textarea, aside, .deck-menu")) { touchX = null; return; }
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    touchX = null;
    // 横向滑动超过 60px 且明显横向（避免误触滚动）
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) goCard(dx < 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea")) return;
    if (e.key === "ArrowLeft") goCard(-1);
    if (e.key === "ArrowRight") goCard(1);
  });

  renderAll();
})();


</script>
</body>
</html>
